<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember</title>
<meta name="description" content="Ember: a small autonomous AI living on a neon rooftop.">
<meta name="theme-color" content="#05060d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ember">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060d; --panel: #0a0c17; --card: #0f1222; --ink: #d8e4ff; --muted: #7683ad; --line: #1b2042;
    --cyan: #3ff0ff; --magenta: #ff3fb4; --amber: #ffcc4d; --vega: #ffb02e;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 13px/1.5 var(--mono); }
  #app { display: flex; height: 100%; }
  #world { position: relative; flex: 1; min-width: 0; min-height: 0; background: var(--bg); }
  #world canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .place { position: absolute; transform: translate(-50%, -100%); padding: 2px 9px; border: 1px solid rgba(63, 240, 255, .55);
    border-radius: 3px; background: rgba(5, 6, 13, .72); color: var(--cyan); font-size: 11px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; text-shadow: 0 0 6px rgba(63, 240, 255, .6); }
  .place.lot { border-style: dashed; border-color: rgba(118, 131, 173, .5); color: var(--muted); text-shadow: none; font-weight: 600; }
  .bubble { position: absolute; transform: translate(-50%, calc(-100% - 10px)); width: max-content; max-width: min(260px, 70vw);
    padding: 8px 12px; border: 1px solid rgba(63, 240, 255, .6); border-radius: 4px; background: rgba(8, 10, 22, .9);
    color: #aebbe0; font-size: 12px; font-style: italic; box-shadow: 0 0 18px rgba(63, 240, 255, .25); }
  .bubble.speech { border-color: var(--magenta); color: #fff; font-style: normal; font-weight: 700; box-shadow: 0 0 18px rgba(255, 63, 180, .4); }
  .bubble.vega { border-color: var(--vega); color: #fff3dc; font-style: normal; font-weight: 700; box-shadow: 0 0 18px rgba(255, 176, 46, .4); }
  .bubble.vega::before { content: attr(data-name); display: block; margin-bottom: 2px; color: var(--vega); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; }
  .place.friend { border-color: rgba(255, 176, 46, .55); color: var(--vega); font-size: 10px; text-shadow: 0 0 6px rgba(255, 176, 46, .6); }
  .place[hidden] { display: none; }
  /* Camera buttons in the corner of the 3D view */
  .cam { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; pointer-events: auto; }
  .cam button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 3px; background: rgba(8, 10, 22, .85);
    color: var(--muted); font: inherit; font-size: 11px; font-weight: 700; white-space: nowrap; cursor: pointer; }
  .cam button:hover { color: var(--ink); border-color: var(--muted); }
  .cam button.on { color: var(--cyan); border-color: rgba(63, 240, 255, .6); box-shadow: 0 0 10px rgba(63, 240, 255, .25); }
  .cam button[hidden] { display: none; }
  body.building .cam { display: none; }
  .holo { position: absolute; transform: translate(-50%, -100%); width: 230px; padding: 8px 10px;
    border: 1px solid rgba(63, 240, 255, .45); background: linear-gradient(rgba(63, 240, 255, .12), rgba(63, 240, 255, .03));
    color: #c4f9ff; font-size: 11px; line-height: 1.45; box-shadow: 0 0 24px rgba(63, 240, 255, .15); }
  .holo b { display: block; margin-bottom: 3px; color: var(--cyan); font-size: 10px; letter-spacing: .14em; }
  .bubble[hidden], .holo[hidden] { display: none; }

  #panel { width: 380px; flex: none; display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
  #panel header { --form: #3ff0ff; padding: 16px 16px 12px; } /* --form: the colour Ember picked for itself */
  .who { display: flex; gap: 12px; align-items: center; }
  /* A little picture of Ember in its current shape and colour */
  .avatar { position: relative; flex: none; width: 46px; height: 46px; border: 1px solid var(--line); border-radius: 50%;
    filter: drop-shadow(0 0 7px color-mix(in srgb, var(--form) 55%, transparent)); }
  .avatar::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; animation: breathe 4s ease-in-out infinite;
    background: radial-gradient(circle at 35% 30%, #fff 0 7%, var(--form) 38%, color-mix(in srgb, var(--form) 35%, #05060d) 100%); }
  .avatar[data-shape="cube"]::before { inset: 12px; border-radius: 3px; rotate: 12deg; }
  .avatar[data-shape="pyramid"]::before { inset: 9px; border-radius: 0; clip-path: polygon(50% 4%, 96% 92%, 4% 92%); }
  .avatar[data-shape="crystal"]::before { inset: 7px; border-radius: 0; clip-path: polygon(50% 0, 86% 50%, 50% 100%, 14% 50%); }
  .avatar[data-shape="ring"]::before, .avatar[data-shape="knot"]::before {
    background: radial-gradient(circle, transparent 0 38%, var(--form) 42% 62%, transparent 66%); }
  .avatar[data-shape="cluster"]::before { background: radial-gradient(circle at 30% 35%, var(--form) 0 17%, transparent 19%),
    radial-gradient(circle at 70% 32%, var(--form) 0 13%, transparent 15%), radial-gradient(circle at 52% 72%, var(--form) 0 19%, transparent 21%); }
  .avatar.asleep::before { opacity: .45; animation-duration: 9s; }
  @keyframes breathe { 50% { scale: .86; } }
  .name-row { display: flex; align-items: center; gap: 10px; }
  h1 { margin: 0; font: 900 24px/1.1 Orbitron, var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--form, var(--cyan));
    text-shadow: 0 0 14px color-mix(in srgb, var(--form, var(--cyan)) 75%, transparent); }
  h2 { margin: 0 0 6px; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .pill { padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 9px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
  .pill::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: currentColor; vertical-align: 1px; }
  .pill.awake { color: #5bf0a0; border-color: rgba(91, 240, 160, .4); }
  .pill.awake::before { box-shadow: 0 0 6px currentColor; animation: blink 2.4s ease-in-out infinite; }
  .pill.asleep { color: #a98bff; border-color: rgba(139, 91, 255, .45); }
  @keyframes blink { 50% { opacity: .3; } }
  #identity { margin-top: 4px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  #about { margin-top: 10px; color: var(--muted); font-size: 12px; font-style: italic; }
  #about:empty { display: none; }
  .doing { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: linear-gradient(135deg, rgba(63, 240, 255, .07), rgba(139, 91, 255, .05)); }
  .doing h2 { margin-bottom: 3px; color: var(--cyan); }
  #activity { font-size: 13px; font-weight: 700; line-height: 1.45; }
  .next { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .next .bar { flex: 1 0 40px; height: 3px; }
  .next .bar[hidden] { display: none; }
  #status { min-width: 0; color: var(--muted); font-size: 11px; }
  .glance { padding: 0 16px 8px; }
  .section { padding: 6px 0; }
  .section[hidden], .glance .empty[hidden] { display: none; }
  .needs { position: absolute; top: 12px; left: 12px; right: 12px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; background: rgba(8, 10, 22, .85); }
  .need { overflow: hidden; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .08em;
    text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
  .need .bar { height: 5px; margin-top: 4px; }
  .now-card { position: absolute; top: 62px; left: 12px; width: 250px; padding: 10px 12px; border: 1px solid rgba(63, 240, 255, .35);
    border-radius: 4px; background: rgba(8, 10, 22, .85); font-size: 12px; }
  .now-card h2 { margin-bottom: 4px; color: var(--cyan); }
  #now-activity { font-weight: 700; }
  #now-need { margin-top: 2px; color: var(--amber); font-size: 11px; }
  #now-thought { margin-top: 6px; color: #aebbe0; font-style: italic; }
  #now-thought time { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; font-style: normal; }
  #now-goal, #now-weather { margin-top: 6px; color: var(--muted); font-size: 11px; }
  #now-goal:empty, #now-weather:empty { display: none; }
  .wish.goal .tag { color: var(--cyan); border-color: rgba(63, 240, 255, .4); }
  .wish.goal.done .tag { color: #5bb974; border-color: rgba(91, 185, 116, .5); }
  .card.live { border-color: var(--magenta); box-shadow: 0 0 14px rgba(255, 63, 180, .25); }
  .card .when { margin-top: 6px; color: var(--amber); font-size: 11px; }
  .card.past { opacity: .6; }
  .mind h3 { margin: 14px 0 4px; color: var(--cyan); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .mind .line { display: flex; gap: 8px; align-items: baseline; margin: 4px 0; font-size: 12px; }
  .mind .line .tag { flex: none; padding: 0 5px; border: 1px solid var(--line); color: var(--muted); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
  .mind .line.grown .tag { color: var(--magenta); border-color: rgba(255, 63, 180, .5); }
  .mind .count { flex: none; color: var(--muted); font-size: 11px; }
  .mind .words { display: flex; flex-wrap: wrap; gap: 6px; }
  .mind .word { padding: 2px 8px; border: 1px solid rgba(139, 91, 255, .5); border-radius: 3px; color: #c9b6ff; font-size: 12px; }
  .memory-item { margin: 8px 0; font-size: 12px; }
  .memory-item .bar { height: 3px; margin-top: 4px; }
  .memory-item small { color: var(--muted); font-size: 10px; }
  .slots { color: var(--muted); font-size: 10px; font-weight: 400; letter-spacing: 0; text-transform: none; }
  .bar { height: 6px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; transition: width .6s; }
  .skill { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 3px 8px; margin: 6px 0; font-size: 12px; }
  .skill .bar { grid-column: 1 / -1; height: 4px; }
  .skill .lv { color: var(--magenta); font-size: 11px; font-weight: 700; }
  .wish { display: flex; gap: 8px; align-items: baseline; margin: 5px 0; font-size: 12px; }
  .wish .tag { flex: none; padding: 0 6px; border: 1px solid var(--line); color: var(--amber); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
  .wish.granted .tag { color: var(--cyan); border-color: rgba(63, 240, 255, .5); }
  .wish a { flex: none; color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); font-style: italic; font-size: 12px; margin: 4px 0; }
  .tabs { z-index: 3; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); padding: 0 8px; background: var(--panel);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .tabs button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; padding: 9px 0 7px;
    border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font: inherit; font-size: 9px;
    font-weight: 700; white-space: nowrap; cursor: pointer; overflow: hidden; }
  .tabs button:hover { color: var(--ink); }
  .tabs button.on { color: var(--cyan); border-bottom-color: var(--cyan); }
  .tabs svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tabs button.on svg { filter: drop-shadow(0 0 4px rgba(63, 240, 255, .7)); }
  .tabs .dot { position: absolute; top: 6px; left: calc(50% + 7px); width: 6px; height: 6px; border-radius: 50%;
    background: var(--magenta); box-shadow: 0 0 6px var(--magenta); }
  .tabs .dot[hidden] { display: none; }
  #feed { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 20px; }

  /* Today: a timeline of moments, one per thought */
  .day { position: sticky; top: 0; z-index: 1; margin: 0 -16px; padding: 12px 16px 6px; color: var(--muted); font-size: 10px; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase; background: linear-gradient(var(--panel) 75%, transparent); }
  .new-mark { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; color: var(--magenta); font-size: 10px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; }
  .new-mark::before, .new-mark::after { content: ""; flex: 1; height: 1px; background: rgba(255, 63, 180, .45); }
  .moment { position: relative; margin-left: 4px; padding: 0 0 16px 18px; border-left: 1px solid var(--line); }
  .moment::before { content: ""; position: absolute; top: 4px; left: -4px; width: 7px; height: 7px; border: 1px solid var(--muted);
    border-radius: 50%; background: var(--panel); }
  .moment.has-thought::before { border-color: var(--cyan); background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .moment.fresh::before { border-color: var(--magenta); background: var(--magenta); box-shadow: 0 0 8px var(--magenta); }
  .stamp { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; letter-spacing: .06em; }
  .thought { margin: 2px 0 6px; color: #c3cdf0; font-size: 12.5px; font-style: italic; line-height: 1.55; }
  .line { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; margin: 5px 0; font-size: 12px; line-height: 1.5; }
  .line .ic { text-align: center; }
  .line.soft { color: var(--muted); }
  .line.big { color: var(--amber); font-weight: 700; }
  .line.jot { color: #b9c4e8; }
  .kind { margin-right: 6px; padding: 0 5px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); font-size: 9px;
    font-weight: 700; letter-spacing: .1em; text-transform: uppercase; vertical-align: 1px; }
  .radio { margin: 6px 0; padding: 7px 10px; border-left: 2px solid var(--amber); border-radius: 0 6px 6px 0;
    background: rgba(255, 204, 77, .06); color: #f3e6c4; font-size: 12px; line-height: 1.5; }
  .radio b { display: block; margin-bottom: 2px; color: var(--amber); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
  .say { width: fit-content; max-width: 100%; margin: 6px 0; padding: 6px 10px; border: 1px solid rgba(255, 63, 180, .5);
    border-radius: 10px 10px 10px 2px; background: rgba(255, 63, 180, .08); color: #ffd6ee; font-size: 12px; }
  .say.vega { border-color: rgba(255, 176, 46, .55); border-radius: 10px 10px 2px 10px; background: rgba(255, 176, 46, .08); color: #ffe9c2; }
  .say.vega b { display: block; color: var(--vega); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }

  /* Vega's tab: its pretend account, the prices on its screens, and what it knows about Ember */
  .vega-panel h3 { color: var(--vega); }
  .vega-head { display: flex; gap: 12px; align-items: center; margin: 14px 0 4px; }
  .vega-face { position: relative; flex: none; width: 46px; height: 38px; border: 2px solid #4a3a1c; border-radius: 7px;
    background: #140a00; box-shadow: 0 0 12px rgba(255, 176, 46, .35); }
  .vega-face::before, .vega-face::after { content: ""; position: absolute; top: 9px; width: 7px; height: 10px; border-radius: 1px;
    background: var(--vega); box-shadow: 0 0 6px var(--vega); animation: vega-blink 4.2s infinite; }
  .vega-face::before { left: 10px; }
  .vega-face::after { right: 10px; }
  @keyframes vega-blink { 0%, 96% { scale: 1 1; } 98% { scale: 1 .15; } }
  .vega-head h3 { margin: 0; font: 900 16px/1.2 Orbitron, var(--mono); letter-spacing: .1em; }
  .vega-head p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
  .vega-now { margin: 8px 0; color: #ffe9c2; font-size: 12px; font-style: italic; }
  .worth { color: #fff; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .worth span { margin-left: 8px; font-size: 13px; }
  .gain { color: #5bf0a0; }
  .loss { color: #ff5c7a; }
  .spark { display: block; width: 100%; height: 56px; margin: 6px 0 2px; }
  .qrow { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto 62px; gap: 10px; align-items: baseline; margin: 5px 0;
    font-size: 12px; font-variant-numeric: tabular-nums; }
  .qrow > :last-child { text-align: right; }
  .qrow .sym { color: var(--vega); font-weight: 700; }
  .qrow .nm { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
  .qrow.shut { opacity: .5; }
  .fine { margin: 10px 0 0; color: var(--muted); font-size: 10px; }

  /* What it found on the internet: a headline, a few points, where it came from */
  .note-card { margin: 6px 0; padding: 10px 12px; border: 1px solid rgba(139, 91, 255, .35); border-radius: 6px;
    background: linear-gradient(rgba(139, 91, 255, .09), rgba(139, 91, 255, .02)); font-size: 12px; }
  .note-card .looked { color: var(--muted); font-size: 11px; }
  .note-card .looked b { color: var(--ink); font-weight: 600; }
  .note-card h4 { margin: 6px 0 4px; color: #e2d6ff; font-size: 12.5px; line-height: 1.4; }
  .note-card ul { margin: 4px 0 0; padding: 0; list-style: none; }
  .note-card li { position: relative; margin: 5px 0; padding-left: 14px; line-height: 1.5; }
  .note-card li::before { content: "›"; position: absolute; left: 2px; color: #8b5bff; font-weight: 700; }
  .note-card li b { color: #fff; }
  .note-card p { margin: 6px 0 0; line-height: 1.5; }
  .note-card:not(.open) .note-body { max-height: 9.5em; overflow: hidden;
    -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
  .more { margin-top: 4px; padding: 0; border: 0; background: none; color: var(--cyan); font: inherit; font-size: 11px; cursor: pointer; }
  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .sources a { max-width: 100%; overflow: hidden; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted);
    font-size: 10px; text-decoration: none; text-overflow: ellipsis; white-space: nowrap; }
  .sources a:hover { color: var(--magenta); border-color: var(--magenta); }
  .note-card time { display: block; margin-top: 8px; color: var(--muted); font-size: 10px; }
  .card { margin: 10px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--card); font-size: 12px; }
  .card .q { margin-bottom: 4px; color: var(--cyan); font-weight: 700; }
  .card a { display: block; margin-top: 4px; overflow: hidden; color: var(--magenta); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .card time { display: block; margin-top: 6px; color: var(--muted); font-size: 11px; }
  .work img { display: block; width: 100%; aspect-ratio: 1; margin: 6px 0 2px; border-radius: 2px; background: #0b0d1a; }
  .poem { margin: 6px 0 2px; color: #ecdcff; font-style: italic; white-space: pre-wrap; }
  .play { margin: 6px 0 2px; padding: 6px 12px; border: 1px solid var(--magenta); border-radius: 3px; background: transparent;
    color: var(--magenta); font: inherit; font-weight: 700; cursor: pointer; }
  footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 18px;
    border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
  #support { padding: 6px 12px; border-radius: 3px; background: var(--magenta); color: #05060d; font-weight: 700;
    text-decoration: none; box-shadow: 0 0 14px rgba(255, 63, 180, .5); white-space: nowrap; }
  #support[hidden] { display: none; }
  #panel > :not(#feed) { flex-shrink: 0; } /* only the feed scrolls; everything above it keeps its height */
  @media (max-width: 760px) { /* phones: the 3D view on top, everything else scrolls underneath */
    #app { flex-direction: column; }
    #world { flex: 1 1 52%; }
    #panel { flex: 1 1 48%; width: 100%; overflow-y: auto; border-left: 0; border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom); }
    #panel header { padding: 12px 16px 8px; }
    footer { padding-left: 16px; padding-right: 16px; }
    #feed { flex: none; overflow: visible; }
    .tabs { position: sticky; top: 0; padding: 0 4px; } /* the tabs stay put while you scroll */
    .day { position: static; }
    .holo { display: none; }
    .needs { top: calc(8px + env(safe-area-inset-top)); left: 8px; right: 8px; gap: 8px; padding: 6px 8px; }
    .need { font-size: 9px; letter-spacing: .02em; }
    .now-card { top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; padding: 8px 10px; }
    .now-card h2 { display: none; }
    #now-thought { margin-top: 4px; }

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = (id) => document.getElementById(id);
const IS_LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const POLL_MS = IS_LOCAL ? 4000 : 60000; // online, Ember only thinks every 10 minutes
const BUILDING = IS_LOCAL && new URLSearchParams(location.search).has('build'); // builder mode: only on your own computer
const IS_PHONE = matchMedia('(max-width: 760px), (pointer: coarse)').matches; // phones get a lighter world to save battery

// ---------------------------------------------------------------------------
// Renderer, camera, glow
// ---------------------------------------------------------------------------
const worldEl = $('world');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_PHONE ? 1.5 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
worldEl.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06050f);
scene.fog = new THREE.FogExp2(0x0b0820, 0.011);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 400);
camera.position.set(10, 8.5, 13);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.5, 0.8, -1.5);
controls.enableDamping = true;
controls.screenSpacePanning = false; // right-drag slides you across the roof, not up into the sky
controls.zoomToCursor = true; // the wheel zooms towards whatever's under the pointer
controls.maxPolarAngle = 1.45;
controls.minDistance = 2.5;
controls.maxDistance = 40;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.4, 0.35, 0.55); // strength, radius, threshold
composer.addPass(bloom);
composer.addPass(new OutputPass());

const skyLight = new THREE.HemisphereLight(0x6a78c8, 0x15121f, 1.3);
scene.add(skyLight);
const moon = new THREE.DirectionalLight(0x9d8cff, 0.8);
moon.position.set(-10, 22, 8);
moon.castShadow = true;
moon.shadow.mapSize.setScalar(IS_PHONE ? 1024 : 2048);
Object.assign(moon.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 });
moon.shadow.camera.updateProjectionMatrix();
scene.add(moon);

// ---------------------------------------------------------------------------
// Day and night: the sky follows the real sun over the place Ember's weather comes from (London, unless
// config.json says otherwise). scenery.json describes the night; by day the haze lifts, the sun comes up and
// the neon fades back. "Always night" on the camera bar keeps it dark, and ?hour=13 previews another time.
// ---------------------------------------------------------------------------
const SKY_AT = { latitude: 51.5072, longitude: -0.1276 }; // replaced by the real spot once state.json arrives
const PREVIEW_HOUR = parseFloat(new URLSearchParams(location.search).get('hour'));
const DAY = { sky: new THREE.Color('#7b9ed8'), fog: new THREE.Color('#a2b8db'), light: new THREE.Color('#dce7ff'),
  sun: new THREE.Color('#fff1d8'), tower: new THREE.Color('#58627e'), grey: new THREE.Color('#8f96a4') };
const DUSK = { sky: new THREE.Color('#d9826f'), fog: new THREE.Color('#d48d7f'), sun: new THREE.Color('#ffa463') };
const MOONLIGHT = new THREE.Color(0x9d8cff), NIGHT_TOWER = new THREE.Color(0x07080f), MOON_SPOT = new THREE.Vector3(-10, 22, 8);
const towerMaterials = []; // the city's windows: dimmer by day
let sceneSky = null, skyMode = 'live', daylight = 0; // daylight: 0 at night, 1 in full day
const sunDisc = new THREE.Mesh(new THREE.SphereGeometry(9, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffe8b0, fog: false }));
const moonDisc = new THREE.Mesh(new THREE.SphereGeometry(5, 24, 16), new THREE.MeshBasicMaterial({ color: 0xd9dcff, fog: false }));
moonDisc.position.set(-0.6, 0.38, -0.7).setLength(300); // low in the north-west, where you can see it from the usual view
scene.add(sunDisc, moonDisc);

function sunPosition(date, latitude, longitude) { // how high the sun is, and its compass bearing, in degrees
  const rad = Math.PI / 180, days = date.getTime() / 86400000 - 10957.5; // days since noon on 1 January 2000
  const anomaly = ((357.528 + 0.9856003 * days) % 360) * rad;
  const along = ((280.46 + 0.9856474 * days) % 360 + 1.915 * Math.sin(anomaly) + 0.02 * Math.sin(2 * anomaly)) * rad;
  const tilt = (23.439 - 0.0000004 * days) * rad;
  const rightAscension = Math.atan2(Math.cos(tilt) * Math.sin(along), Math.cos(along));
  const declination = Math.asin(Math.sin(tilt) * Math.sin(along));
  const hourAngle = ((280.46061837 + 360.98564736629 * days) % 360) * rad + longitude * rad - rightAscension;
  const lat = latitude * rad;
  const altitude = Math.asin(Math.sin(lat) * Math.sin(declination) + Math.cos(lat) * Math.cos(declination) * Math.cos(hourAngle));
  const bearing = Math.atan2(-Math.sin(hourAngle), Math.cos(lat) * Math.tan(declination) - Math.sin(lat) * Math.cos(hourAngle));
  return { altitude: altitude / rad, bearing: bearing / rad };
}

function applyDaylight(weatherCode = 0) {
  if (!sceneSky) return;
  let when = new Date();
  if (Number.isFinite(PREVIEW_HOUR)) when.setHours(Math.floor(PREVIEW_HOUR), (PREVIEW_HOUR % 1) * 60, 0, 0);
  const sun = BUILDING || skyMode === 'night' ? { altitude: -40, bearing: 0 } : sunPosition(when, SKY_AT.latitude, SKY_AT.longitude);
  const k = Math.min(1, Math.max(0, (sun.altitude + 6) / 16)); // from 6° below the horizon to 10° above
  const day = k * k * (3 - 2 * k);
  const dusk = Math.max(0, 1 - Math.abs(sun.altitude - 2) / 10); // the warm glow round sunrise and sunset
  const cloud = weatherCode >= 51 ? 0.75 : weatherCode >= 3 ? 0.5 : 0; // overcast days are grey
  daylight = day;
  const daySky = DAY.sky.clone().lerp(DAY.grey, cloud), dayFog = DAY.fog.clone().lerp(DAY.grey, cloud);
  scene.background.set(sceneSky.color).lerp(daySky, day).lerp(DUSK.sky, dusk * 0.5 * (1 - cloud));
  scene.fog.color.set(sceneSky.fog_color).lerp(dayFog, day).lerp(DUSK.fog, dusk * 0.5 * (1 - cloud));
  baseFog = sceneSky.fog * (1 - 0.3 * day);
  skyLight.color.set(sceneSky.light_color).lerp(DAY.light, day);
  baseLight = sceneSky.light + day * 1.1;
  const toSun = new THREE.Vector3(Math.sin(sun.bearing * Math.PI / 180), 0, -Math.cos(sun.bearing * Math.PI / 180)) // north is -Z
    .multiplyScalar(Math.cos(sun.altitude * Math.PI / 180)).setY(Math.sin(sun.altitude * Math.PI / 180));
  moon.position.copy(day > 0.05 ? toSun.clone().setLength(30) : MOON_SPOT);
  moon.color.copy(MOONLIGHT).lerp(DAY.sun, day).lerp(DUSK.sun, dusk * 0.6 * (1 - cloud));
  moon.intensity = 0.8 + day * 2.8 * (1 - cloud * 0.7);
  renderer.toneMappingExposure = sceneSky.exposure + day * 0.25;
  bloom.strength = sceneSky.glow * (1 - 0.55 * day);
  for (const material of towerMaterials) {
    material.emissiveIntensity = material.userData.glow * (1 - 0.8 * day);
    material.color.copy(NIGHT_TOWER).lerp(DAY.tower, day);
  }
  sunDisc.visible = sun.altitude > -4 && cloud < 0.6;
  sunDisc.position.copy(toSun).setLength(300);
  sunDisc.material.color.set(0xfff4d6).lerp(DUSK.sun, dusk);
  moonDisc.visible = day < 0.5 && cloud < 0.6;
}

const materials = {};
function mat(color, extra = {}) {
  const key = color + JSON.stringify(extra);
  return materials[key] ??= new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.35, ...extra });
}
const neon = (color, strength = 1.2) => mat(0x000000, { emissive: color, emissiveIntensity: strength });
function put(geometry, material, x, y, z, parent = scene) {
  const mesh = new THREE.Mesh(geometry, typeof material === 'number' ? mat(material) : material);
  mesh.position.set(x, y, z);
  mesh.castShadow = mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function addLight(x, y, z, color, parent, intensity = 6) {
  const light = new THREE.PointLight(color, intensity, 9, 2);
  light.position.set(x, y, z);
  parent.add(light);
}
function seeded(seed) { // the same "random" city every visit
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------------------------------------------------------------------------
// The rooftop and the city around it. All of it comes from site/scenery.json,
// which you can change in builder mode (the World tab), so none of it is fixed here.
// ---------------------------------------------------------------------------
const DEFAULT_SCENERY = { // what the world looks like if scenery.json is missing something
  roof: { size: 24, color: '#1a1d2e', grid: true, grid_color: '#3ff0ff', edge_colors: ['#ff3fb4', '#3ff0ff', '#3ff0ff', '#ff3fb4'], edge_glow: 0.9 },
  tower: { show: true, depth: 120, window_color: '#8b5bff' },
  city: { seed: 42, towers: 120, near: 36, far: 121, min_height: 40, max_height: 140, window_glow: 0.5, antennas: 0.3,
    colors: ['#3ff0ff', '#ff3fb4', '#ffcc4d', '#8b5bff', '#9fb4ff'] },
  cars: { count: 14 },
  sky: { color: '#06050f', fog_color: '#0b0820', fog: 0.011, light_color: '#6a78c8', light: 1.3, glow: 0.4, exposure: 0.85 },
  signs: [],
  props: [],
};
const SCENERY_SECTIONS = ['roof', 'tower', 'city', 'cars', 'sky'];
const withDefaults = (loaded = {}) => ({
  ...DEFAULT_SCENERY, ...loaded,
  ...Object.fromEntries(SCENERY_SECTIONS.map((key) => [key, { ...DEFAULT_SCENERY[key], ...(loaded[key] ?? {}) }])),
});
let ROOF = 12; // half the roof's width: the roof spans -ROOF..ROOF
let baseFog = 0.011, baseLight = 1.3; // the weather and lightning change these for a moment, then go back
const hex = (color) => new THREE.Color(color).getHex();

function makeWindowsTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, 64, 128);
  for (let y = 4; y < 128; y += 8) for (let x = 4; x < 64; x += 10) {
    if (Math.random() < 0.38) {
      const v = 110 + Math.random() * 145;
      ctx.fillStyle = `rgb(${v},${v},${v})`;
      ctx.fillRect(x, y, 6, 4);
    }
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}
const windowsTexture = makeWindowsTexture();
function towerMaterial(tint, repeatX, repeatY, glow = 0.5) {
  const map = windowsTexture.clone();
  map.needsUpdate = true;
  map.repeat.set(repeatX, repeatY);
  const material = new THREE.MeshStandardMaterial({ color: 0x07080f, roughness: 0.8, emissive: tint, emissiveMap: map, emissiveIntensity: glow });
  material.userData.glow = glow; // its night-time brightness (day and night dim it, see applyDaylight)
  towerMaterials.push(material);
  return material;
}

function drawSign(sign, group) { // neon text on a transparent board (drawn once the fonts have loaded)
  document.fonts.ready.then(() => {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 160;
    const ctx = canvas.getContext('2d');
    ctx.font = '900 112px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = sign.color;
    ctx.fillText(sign.text, 256, 84, 500);
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    group.add(new THREE.Mesh(new THREE.PlaneGeometry(sign.size, sign.size * 160 / 512),
      new THREE.MeshBasicMaterial({ map: texture, color: 0x8c8c8c, transparent: true, side: THREE.DoubleSide, depthWrite: false })));
  });
}

let sceneryGroup = null;
const sceneryParts = { props: {}, signs: {} }; // id -> group, so builder mode can grab them
const blinkers = [], cars = [];
function disposeTree(root) { // free the old city's textures before building a new one
  const shared = new Set(Object.values(materials));
  root.traverse((o) => {
    o.geometry?.dispose();
    if (o.material && !shared.has(o.material)) {
      o.material.map?.dispose();
      o.material.emissiveMap?.dispose();
      o.material.dispose();
    }
  });
}

function buildScenery(sc) {
  if (sceneryGroup) { scene.remove(sceneryGroup); disposeTree(sceneryGroup); }
  sceneryGroup = new THREE.Group();
  scene.add(sceneryGroup);
  sceneryParts.props = {};
  sceneryParts.signs = {};
  blinkers.length = 0;
  cars.length = 0;
  towerMaterials.length = 0;
  const { roof, tower, city, sky } = sc;
  sceneSky = sky;
  ROOF = Math.max(4, Math.min(40, roof.size / 2));

  // Sky, fog, light and glow
  scene.background = new THREE.Color(sky.color);
  scene.fog.color.set(sky.fog_color);
  baseFog = sky.fog;
  scene.fog.density = baseFog;
  skyLight.color.set(sky.light_color);
  baseLight = sky.light;
  skyLight.intensity = baseLight;
  bloom.strength = sky.glow;
  renderer.toneMappingExposure = sky.exposure;
  Object.assign(moon.shadow.camera, { left: -ROOF - 2, right: ROOF + 2, top: ROOF + 2, bottom: -ROOF - 2 });
  moon.shadow.camera.updateProjectionMatrix();
  controls.maxDistance = Math.max(40, ROOF * 3.4);

  // The roof: platform, grid and neon edges
  put(new THREE.BoxGeometry(ROOF * 2, 1, ROOF * 2), mat(hex(roof.color), { roughness: 0.7, metalness: 0.25 }), 0, -0.5, 0, sceneryGroup);
  if (roof.grid) {
    const grid = new THREE.GridHelper(ROOF * 2, Math.round(ROOF * 2), hex(roof.grid_color), 0x1b2042);
    grid.position.y = 0.01;
    grid.material.transparent = true;
    grid.material.opacity = 0.18;
    sceneryGroup.add(grid);
  }
  const [front, back, right, left] = roof.edge_colors;
  if (roof.edge_glow > 0) {
    for (const [x, z, w, d, color] of [[0, ROOF, ROOF * 2, 0.12, front], [0, -ROOF, ROOF * 2, 0.12, back],
      [ROOF, 0, 0.12, ROOF * 2, right], [-ROOF, 0, 0.12, ROOF * 2, left]]) {
      put(new THREE.BoxGeometry(w, 0.12, d), neon(hex(color), roof.edge_glow), x, 0.06, z, sceneryGroup).castShadow = false;
    }
  }

  // The skyscraper Ember lives on top of
  if (tower.show) {
    put(new THREE.BoxGeometry(ROOF * 2, tower.depth, ROOF * 2),
      towerMaterial(hex(tower.window_color), Math.max(1, Math.round(ROOF / 2)), Math.round(tower.depth / 4), city.window_glow),
      0, -tower.depth / 2 - 0.5, 0, sceneryGroup).receiveShadow = false;
  }

  // The city all around (the same seed always makes the same city)
  const rand = seeded(city.seed);
  const palette = city.colors.length ? city.colors.map(hex) : [0x8b5bff];
  const near = Math.max(city.near, ROOF + 8), far = Math.max(city.far, near + 1);
  for (let i = 0; i < (IS_PHONE ? Math.min(city.towers, 80) : city.towers); i++) {
    const angle = rand() * Math.PI * 2, dist = near + rand() * (far - near);
    const w = 5 + rand() * 9, d = 5 + rand() * 9, h = city.min_height + rand() * Math.max(0, city.max_height - city.min_height);
    const x = Math.cos(angle) * dist, z = Math.sin(angle) * dist, top = -70 + h;
    const building = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
      towerMaterial(palette[Math.floor(rand() * palette.length)], Math.round(w / 2), Math.round(h / 6), city.window_glow));
    building.position.set(x, -70 + h / 2, z);
    sceneryGroup.add(building);
    if (rand() < city.antennas) {
      put(new THREE.CylinderGeometry(0.15, 0.15, 6, 5), 0x111111, x, top + 3, z, sceneryGroup).castShadow = false;
      blinkers.push(put(new THREE.SphereGeometry(0.4, 8, 6), new THREE.MeshStandardMaterial({ color: 0, emissive: 0xff2040, emissiveIntensity: 1.5 }), x, top + 6.2, z, sceneryGroup));
    }
  }

  // Flying cars on circular lanes
  for (let i = 0; i < sc.cars.count; i++) {
    const car = new THREE.Group();
    put(new THREE.BoxGeometry(1.6, 0.45, 0.8), 0x15182a, 0, 0, 0, car).castShadow = false;
    put(new THREE.BoxGeometry(0.08, 0.18, 0.6), neon(i % 2 ? 0x3ff0ff : 0xffffff, 1.5), 0.82, 0, 0, car);
    put(new THREE.BoxGeometry(0.08, 0.14, 0.6), neon(0xff2040, 1.2), -0.82, 0, 0, car);
    car.userData = { radius: Math.max(22, ROOF + 10) + rand() * 40, height: -6 + rand() * 30,
      speed: (0.04 + rand() * 0.06) * (rand() < 0.5 ? 1 : -1), angle: rand() * Math.PI * 2 };
    sceneryGroup.add(car);
    cars.push(car);
  }

  // Neon signs: face the roof unless you've turned them
  for (const sign of sc.signs) {
    const group = new THREE.Group();
    group.userData.signId = sign.id;
    const [x, y, z] = sign.pos;
    group.position.set(x, y, z);
    group.rotation.y = sign.rotation !== undefined ? THREE.MathUtils.degToRad(sign.rotation) : Math.atan2(-x, -z);
    sceneryGroup.add(group);
    sceneryParts.signs[sign.id] = group;
    drawSign(sign, group);
  }

  // Props: decorations you place anywhere, even floating (same looks as buildings)
  for (const prop of sc.props) {
    const group = new THREE.Group();
    group.userData.propId = prop.id;
    group.position.set(...prop.pos);
    group.rotation.y = THREE.MathUtils.degToRad(prop.rotation ?? 0);
    group.scale.setScalar(prop.scale ?? 1);
    sceneryGroup.add(group);
    sceneryParts.props[prop.id] = group;
    lookBuilder(prop)(0, 0, group);
  }

let rainCount = DROPS, rainSpeed = 28, stormy = false, nextFlash = 0, flashLeft = 0;
function setWeather(weather) {
  const code = weather?.code ?? 61;
  const snow = (code >= 71 && code <= 77) || code === 85 || code === 86;
  rainCount = code <= 3 || code === 45 || code === 48 ? 0
    : snow ? 1200 : code <= 57 ? 500 : [61, 80].includes(code) ? 1000 : [63, 81].includes(code) ? 1400 : DROPS;
  if (IS_PHONE) rainCount = Math.min(rainCount, 900);
  rainSpeed = snow ? 5 : 28;
  rainMaterial.color.set(snow ? 0xdde6ff : 0x7f95d8);
  rainMaterial.opacity = snow ? 0.7 : 0.35;
  scene.fog.density = code === 45 || code === 48 ? Math.max(0.03, baseFog) : baseFog;
  stormy = code >= 95;

}

function drawCode(line) {
  codeLines.push(line ?? Array.from({ length: 6 + Math.floor(Math.random() * 18) },

function shapesBuilder(shapes) { // simple buildings described in buildings.json
  return (x, z, group) => {
    let top = 1;
    for (const shape of shapes) {
      const [a = 1, b = 1, c = 1] = shape.size ?? [];
      const [px = 0, py = 0, pz = 0] = shape.pos ?? [];
      const geometry = shape.type === 'cylinder' ? new THREE.CylinderGeometry(a, a, b, 24)
        : shape.type === 'sphere' ? new THREE.SphereGeometry(a, 20, 14) : new THREE.BoxGeometry(a, b, c);
      const color = new THREE.Color(shape.color ?? '#2a2f45').getHex();
      put(geometry, shape.glow ? neon(color) : mat(color), x + px, py, z + pz, group);
      top = Math.max(top, py + (shape.type === 'sphere' ? a : b / 2));
    }
    return { anchor: new THREE.Vector3(x, top + 0.8, z - 1.5) };
  };
}
// 3D models you make yourself, in site/models/: .glb/.gltf (Blender etc.) or .obj (Roblox Studio: File > Export Selection).
// Compressed .glb files (Blender's "Compression" option) work too, and any animations in them play on a loop.
const gltfLoader = new GLTFLoader()
  .setDRACOLoader(new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/'))
  .setMeshoptDecoder(MeshoptDecoder);
const animations = []; // { mixer, root } for every animated model on the roof
function playAnimations(gltf) {
  if (!gltf.animations.length) return;
  const mixer = new THREE.AnimationMixer(gltf.scene);
  for (const clip of gltf.animations) mixer.clipAction(clip).play();
  animations.push({ mixer, root: gltf.scene });
}
function inScene(object) {
  for (let o = object; o; o = o.parent) if (o === scene) return true;
  return false;
}
function modelBuilder(building) {
  return (x, z, group) => {
    const info = { anchor: new THREE.Vector3(x, 3.4, z - 1.8) };
    const place = (object) => {
      object.traverse((o) => {
        if (!o.isMesh) return;
        o.castShadow = o.receiveShadow = true;
        if (o.name.startsWith('LiveTicker')) o.material = tickerMaterial; // real prices scroll across it
      });
      if (building.autofit !== false) { // resize it to fill a lot, sitting on the roof just behind where Ember stands
        const size = new THREE.Box3().setFromObject(object).getSize(new THREE.Vector3());
        object.scale.multiplyScalar(3.2 / Math.max(size.x, size.z, 0.001));
        const fitted = new THREE.Box3().setFromObject(object), centre = fitted.getCenter(new THREE.Vector3());
        object.position.set(x - centre.x, -fitted.min.y, z - 1.8 - centre.z);
      }
      group.add(object);
      info.anchor.y = new THREE.Box3().setFromObject(object).max.y + 0.6;
    };
    const failed = () => console.warn(`Couldn't load the model ${building.model}`);
    if (/\.obj$/i.test(building.model)) {
      const loadObj = (materials) => {
        const loader = new OBJLoader();
        if (materials) { materials.preload(); loader.setMaterials(materials); }
        loader.load(building.model, place, undefined, failed);
      };
      if (building.mtl) new MTLLoader().load(building.mtl, loadObj, undefined, () => loadObj(null));
      else loadObj(null);
    } else {
      gltfLoader.load(building.model, (gltf) => { place(gltf.scene); playAnimations(gltf); }, undefined, failed);
    }
    return info;
  };
}
function placeholder(x, z, group) {

// Each building is its own group: placed at the spot where Ember stands, turned by "rotation" (degrees)
// and resized by "scale". Builder mode drags these groups around.
let worldGroup = null, worldKey = '', places = {}, researchAnchor = null;
function lookBuilder(thing) { // a built-in piece, your own model, simple shapes, or a placeholder box
  return /\.(glb|gltf|obj)$/i.test(thing.model ?? '') ? modelBuilder(thing)
    : builders[thing.model] ?? (thing.shapes?.length ? shapesBuilder(thing.shapes) : placeholder);
}
function buildBuilding(building) {
  const group = new THREE.Group();
  group.userData.buildingId = building.id;
  group.position.set(building.pos[0], 0, building.pos[1]);
  group.rotation.y = THREE.MathUtils.degToRad(building.rotation ?? 0);
  group.scale.setScalar(building.scale ?? 1);
  worldGroup.add(group);
  group.updateMatrixWorld();
  const info = lookBuilder(building)(0, 0, group);
  if (info.sleep) { // where Ember curls up, turned into roof coordinates
    const spot = group.localToWorld(new THREE.Vector3(info.sleep.x, info.sleep.y, info.sleep.z));
    info.sleep = { x: spot.x, z: spot.z, y: spot.y };
  }
  places[building.id] = { ...info, group, x: building.pos[0], z: building.pos[1], building };
  addLabel(building.name, info.anchor, 'place', group);
  return group;
}

function buildWorld(s, force = false) {
  const key = JSON.stringify([s.buildings, s.empty_lots]);
  if (key === worldKey && !force) return; // nothing changed in buildings.json
  worldKey = key;
  if (worldGroup) scene.remove(worldGroup);
  for (const { el } of labels) el.remove();
  labels.length = 0;
  worldGroup = new THREE.Group();
  scene.add(worldGroup);
  places = {};
  for (const building of s.buildings) buildBuilding(building);
  for (const lot of s.empty_lots ?? []) emptyLot(lot, worldGroup);

  const studio = Object.values(places).find((p) => p.building.actions?.includes('create'))
    ?? Object.values(places).find((p) => p.building.actions?.includes('search'));
  artHolo.userData.placed = Boolean(studio);
  if (studio) artHolo.position.set(studio.x + 2.7, 2.6, studio.z - 1.2);
  const lab = Object.values(places).find((p) => p.building.actions?.includes('search'));
  researchAnchor = lab ? new THREE.Vector3(lab.x - 3, 3.4, lab.z - 1.2) : null;
  const desk = Object.values(places).find((p) => p.building.actions?.includes('friend'));
  vega = desk ? buildVega(desk, s.vega?.name ?? 'Vega') : null;
}

function moveTo(place) {
  const spot = asleep && place.sleep ? place.sleep : { x: place.x, z: place.z, y: 0 };

function when(entry, today) {

let galleryItems = [], galleryKey = null;

// Research notes are a headline and a few "- " points. Older ones were one paragraph, sometimes numbered "1. 2. 3."
const BULLET = /^(?:[-•*]|\d+[.)])\s+/;
function noteParts(raw) {
  const text = raw.replace(/^Learned:\s*/, '').replace(/\*\*/g, '').trim();
  const lines = text.split(/\n+/).map((line) => line.trim()).filter(Boolean);
  let headline = '', points = [];
  if (lines.slice(1).some((line) => BULLET.test(line))) {
    for (const line of lines) {
      if (BULLET.test(line)) points.push(line.replace(BULLET, ''));
      else if (points.length) points[points.length - 1] += ` ${line}`;
      else headline = headline ? `${headline} ${line}` : line;
    }
  } else {
    const numbered = text.split(/(?:^|\s)[1-9][.)]\s+/).map((part) => part.trim());
    if (numbered.length < 3) return { headline: '', points: [], paragraph: text };
    [headline, ...points] = numbered;
  }
  if (/:$/.test(headline) && /\b(found|here|points?)\b/i.test(headline)) headline = ''; // "Here's what I found:" says nothing
  return { headline: headline.replace(/:$/, ''), points: points.filter(Boolean), paragraph: '' };
}
function pointEl(point) {
  const item = el('li'), colon = point.indexOf(': ');
  if (colon > 2 && colon < 60) item.append(el('b', '', point.slice(0, colon + 1)), point.slice(colon + 1)); // "Phone calls help: ..."
  else item.textContent = point;
  return item;
}
const hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; } };

function noteCard(entry, footer = '') {
  const { headline, points, paragraph } = noteParts(entry.text);
  const id = `${entry.date} ${entry.time} ${entry.query ?? ''}`;
  const card = el('div', 'note-card'), body = el('div', 'note-body');
  if (entry.query) {
    const looked = el('div', 'looked', '🔎 Looked up ');
    looked.append(el('b', '', entry.query));
    card.append(looked);
  }
  if (headline) body.append(el('h4', '', headline));
  if (points.length) body.append(el('ul'));
  for (const point of points) body.lastChild.append(pointEl(point));
  if (paragraph) body.append(el('p', '', paragraph));
  card.append(body);
  const long = (headline + points.join('') + paragraph).length > 240;
  card.classList.toggle('open', !long || opened.has(id));
  if (long) {
    const more = el('button', 'more', card.classList.contains('open') ? 'Show less' : 'Show more');
    more.addEventListener('click', () => {
      const open = card.classList.toggle('open');
      if (open) opened.add(id); else opened.delete(id);
      more.textContent = open ? 'Show less' : 'Show more';
    });
    card.append(more);
  }
  if (entry.sources?.length) {
    const sources = el('div', 'sources');
    for (const source of entry.sources) {
      const link = safeLink(source.url, hostOf(source.url));
      link.title = source.title || source.url;
      sources.append(link);
    }
    card.append(sources);
  }
  if (footer) card.append(el('time', '', footer));
  return card;
}

// Today: the log grouped into moments, each one a thought and whatever it led to
const ACTIVITY_KINDS = new Set(['rest', 'play', 'create', 'learn', 'explore', 'socialise', 'reflect']);
const BIG_KINDS = new Set(['levelup', 'hobby', 'goal', 'wish', 'form', 'build', 'creation', 'self', 'diary', 'chapter']);
const SOFT_KINDS = new Set(['weather', 'city', 'sleep', 'wake', 'missed', 'rut', 'forgot', 'search', 'event']);
const minuteOf = (e) => { const [h, m] = e.time.split(':').map(Number); return h * 60 + m; };
const stampOf = (e) => `${e.date ?? ''} ${e.time}`;
function moments(events) {
  const list = [];
  let current = null;
  for (const e of events) {
    if (e.kind === 'thought' || !current || current.date !== e.date || minuteOf(e) - current.minute > 3) {
      current = { date: e.date, time: e.time, minute: minuteOf(e), thought: '', items: [] };
      list.push(current);
    }
    if (e.kind === 'thought') current.thought = e.text;
    else current.items.push(e);
  }
  return list;
}
function lineEl(e) {
  if (e.kind === 'say') return el('div', 'say', e.text.replace(/^Said:\s*/, ''));
  const [, station, heard] = (e.kind === 'radio' && /^On the radio \((.+?)\): ([\s\S]+)$/.exec(e.text)) || [];
  if (heard) {
    const box = el('div', 'radio');
    box.append(el('b', '', `📻 ${station}`), heard);
    return box;
  }
  const [, who, how, words] = (e.kind === 'friend' && /^(\S+?)(?: \((.+?)\))?: "([\s\S]*)"$/.exec(e.text)) || [];
  if (words) { // Vega talking
    const box = el('div', 'say vega');
    box.append(el('b', '', `🤖 ${who}${how ? ` · ${how}` : ''}`), words);
    return box;
  }
  const watched = e.kind === 'event' && /^Watched /.test(e.text);
  const look = e.kind === 'note' ? 'jot' : BIG_KINDS.has(e.kind) || watched ? 'big' : SOFT_KINDS.has(e.kind) ? 'soft' : '';
  const row = el('div', `line ${look}`), text = el('span');
  if (ACTIVITY_KINDS.has(e.kind)) text.append(el('span', 'kind', e.kind));
  text.append(e.text.replace(/^Made a note:\s*/, ''));
  row.append(el('span', 'ic', watched ? '🎆' : e.kind === 'event' ? '→' : ICONS[e.kind] ?? '›'), text);
  return row;
}
function momentEl(m, s, fresh) {
  const box = el('div', `moment${m.thought ? ' has-thought' : ''}${fresh ? ' fresh' : ''}`);
  box.append(el('div', 'stamp', m.time));
  if (m.thought) box.append(el('div', 'thought', m.thought));
  m.items.forEach((e, i) => {
    if (e.kind === 'search' && m.items[i + 1]?.kind === 'learned') return; // shown on the note it led to
    if (e.kind !== 'learned') return box.append(lineEl(e));
    const entry = s.learned.find((l) => l.date === e.date && l.time === e.time && e.text === `Learned: ${l.text}`);
    const query = m.items[i - 1]?.kind === 'search' ? m.items[i - 1].text.match(/"(.*)"/)?.[1] : '';
    box.append(noteCard(entry ?? { date: e.date, time: e.time, text: e.text, query }));

}
function dayLabel(date, today) {
  if (!date || date === today) return 'Today';
  const yesterday = new Date(`${today}T12:00`);
  yesterday.setDate(yesterday.getDate() - 1);

// Vega's tab: its pretend account, what's on its screens, and what it knows about Ember
const dollars = (n, sign = false) => { // coins worth under a dollar get four decimals
  const digits = Math.abs(n) > 0 && Math.abs(n) < 1 ? 4 : 2;
  return `${n < 0 ? '-' : sign ? '+' : ''}$${Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits })}`;
};
const percent = (n) => el('span', n >= 0 ? 'gain' : 'loss', `${n >= 0 ? '+' : ''}${n.toFixed(2)}%`);
const quantity = (n) => (n >= 100 ? n.toFixed(1) : String(+n.toFixed(4)));
function qrow(...cells) {
  const row = el('div', 'qrow');
  row.append(...cells);
  return row;
}
function sparkline(history, start) { // what the account has been worth, hour by hour, against what it started with
  const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'spark');
  svg.setAttribute('viewBox', '0 0 300 56');

  if (values.length < 2) return svg;
  const low = Math.min(...values, start), high = Math.max(...values, start), y = (v) => 52 - ((v - low) / (high - low || 1)) * 48;
  const line = (tag, attributes) => {
    const shape = document.createElementNS(ns, tag);
    for (const [key, value] of Object.entries({ fill: 'none', 'vector-effect': 'non-scaling-stroke', ...attributes })) shape.setAttribute(key, value);
    svg.append(shape);
  };
  line('line', { x1: 0, x2: 300, y1: y(start), y2: y(start), stroke: '#7683ad', 'stroke-dasharray': '3 4' });
  line('polyline', { points: values.map((v, i) => `${(i / (values.length - 1)) * 300},${y(v)}`).join(' '),
    stroke: values.at(-1) >= start ? '#5bf0a0' : '#ff5c7a', 'stroke-width': 2 });
  return svg;
}
function vegaPanel(s) {

  panel.append(el('h3', '', 'Recent trades'));
  for (const t of v.trades.slice().reverse()) {
    const row = el('div', 'line'), text = el('span', '', `${t.side === 'buy' ? 'Bought' : 'Sold'} ${quantity(t.qty)} ${t.symbol} at ${dollars(t.price)} (${dollars(t.dollars)}) `);

    panel.append(row);
  }
  if (!v.trades.length) panel.append(el('p', 'empty', `No trades yet. ${v.name} sits down at the screens a few times a day.`));

  const days = v.days ?? [];
  for (const day of days.slice().reverse()) {
    const card = el('div', 'card');

    panel.append(card);
  }
  if (!days.length) panel.append(el('p', 'empty', `${v.name} writes in it at midnight, while ${s.name} dreams.`));
  panel.append(el('p', 'fine', 'Pretend money, real prices: a game, not financial advice.'));
  return [panel];
}

// Remembered in this browser only, so each visit can show what's new since the last one
const store = {
  get(key, fallback) { try { return JSON.parse(localStorage.getItem(`ember.${key}`)) ?? fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(`ember.${key}`, JSON.stringify(value)); } catch { /* private window: forget */ } },
};
let seenBefore = store.get('lastSeen', ''), lastSeen = seenBefore; // the newest thing you'd seen on your last visit
function markSeen(s) {
  const newest = s.events.at(-1);
  if (!newest || document.hidden || stampOf(newest) === lastSeen) return;
  lastSeen = stampOf(newest);
  store.set('lastSeen', lastSeen);
}
function todayItems(s) {
  const list = moments(s.events.slice(-150)).reverse().slice(0, 40);
  if (!list.length) return [el('p', 'empty', 'Nothing has happened yet.')];
  const items = [];
  let day = null, anyFresh = false, marked = false;
  for (const m of list) {
    const fresh = Boolean(seenBefore) && stampOf(m) > seenBefore;
    if (!fresh && anyFresh && !marked) { items.push(el('div', 'new-mark', 'new since you last looked ▲')); marked = true; }
    anyFresh ||= fresh;
    if (m.date !== day) { day = m.date; items.push(el('div', 'day', dayLabel(m.date, s.today))); }
    items.push(momentEl(m, s, fresh));
  }
  return items;
}

const TAB_KEYS = { // a dot on a tab when it has something you haven't seen
  diary: (s) => `${s.days.length}|${s.days.at(-1)?.date}`,
  mind: (s) => `${s.chapters?.length ?? 0}|${Object.values(s.self ?? {}).flat().length}|${s.beliefs.length}`,
  city: (s) => (s.city ?? []).filter((e) => e.status === 'upcoming').map((e) => e.title).join('|'),
  gallery: () => String(galleryKey),
  research: (s) => { const last = s.learned.filter((m) => m.query).at(-1); return last ? stampOf(last) : ''; },
  vega: (s) => { const last = s.vega?.trades.at(-1); return `${last ? stampOf(last) : ''}|${s.vega?.notes.length ?? 0}|${s.vega?.days?.length ?? 0}`; },
};
let seenTabs = store.get('seenTabs', null);
function updateDots(s) {
  const keys = Object.fromEntries(Object.entries(TAB_KEYS).map(([name, key]) => [name, key(s)]));
  const before = JSON.stringify(seenTabs);
  seenTabs ??= { ...keys }; // first visit: nothing counts as new
  if (tab in keys && !document.hidden) seenTabs[tab] = keys[tab];
  if (JSON.stringify(seenTabs) !== before) store.set('seenTabs', seenTabs);
  document.querySelectorAll('.tabs .dot').forEach((dot) => {
    const name = dot.parentElement.dataset.tab;
    dot.hidden = seenTabs[name] === keys[name];
  });
}

let tab = 'today', feedKey = '';
function renderFeed(s) {
  updateDots(s);
  if (tab === 'today') markSeen(s);
  const last = s.events.at(-1), lastLearned = s.learned.at(-1);
  const key = {
    today: () => `t|${s.events.length}|${last?.date}|${last?.time}|${last?.text}|${seenBefore}`,
    diary: () => `d|${s.days.length}|${s.days.at(-1)?.date}`,
    mind: () => `m|${s.today}|${JSON.stringify([s.personality, s.self, s.beliefs, s.fascinations, s.chapters])}`,
    memory: () => `y|${s.today}|${JSON.stringify(s.memory_view)}`,

  }[tab]();
  if (key === feedKey) return;

  let items;

  } else if (tab === 'today') {

  } else if (tab === 'vega') {
    items = vegaPanel(s);
  } else {
    items = s.learned.slice().reverse().map((m) => {

    const bar = el('div', 'bar'), fill = el('i');
    fill.style.width = `${Math.round(skill.progress * 100)}%`;
    fill.style.background = 'var(--magenta)';
    bar.append(fill);
    row.append(name, el('span', 'lv', `LV ${skill.level}`), bar);
    return row;
  }));

  $('wishes').replaceChildren(...s.wishes.slice(-5).reverse().map((wish) => {
    const row = el('div', `wish${wish.granted ? ' granted' : ''}`);
    row.append(el('span', 'tag', wish.granted ? 'built' : 'wish'), el('span', '', wish.text));
    if (wish.issue_url) row.append(safeLink(wish.issue_url, 'issue'));
    return row;
  }));
  $('sec-skills').hidden = !s.skills.length;
  $('sec-goals').hidden = !activeGoals.length && !finishedGoals.length;
  $('sec-wishes').hidden = !s.wishes.length;
  $('glance-empty').hidden = !(s.skills.length + activeGoals.length + finishedGoals.length + s.wishes.length === 0);

  const usd = s.costs?.usd ?? 0;
  $('cost').textContent = `Running cost: $${usd.toFixed(usd < 1 ? 3 : 2)} this month`;
  const support = $('support');
  support.hidden = !/^https:\/\//.test(s.support_url ?? '');
  if (!support.hidden) { support.href = s.support_url; support.textContent = s.support_text || 'Support'; }

  renderFeed(s);

  // Bubble: only for things said out loud during the latest thought (thoughts live in the "right now" card)
  const speaking = Boolean(s.say) && !s.asleep && s.said_at >= s.tick_started_at - 1;
  bubble.className = speaking ? 'bubble speech' : 'bubble';
  bubble.textContent = s.asleep ? 'Zzz…' : speaking ? s.say : '';
  bubble.hidden = !bubble.textContent;

  const v = s.vega; // Vega's bubble works the same way, and its face mouths the words for a few seconds
  const vegaSpeaking = Boolean(vega && v?.say) && v.said_at >= s.tick_started_at - 1;
  vegaBubble.hidden = !vegaSpeaking;
  if (vegaSpeaking) { vegaBubble.dataset.name = v.name; vegaBubble.textContent = v.say; }
  if (vegaSpeaking && v.said_at !== vegaSaidAt) { vegaSaidAt = v.said_at; vegaTalkUntil = Date.now() + Math.min(8000, 1500 + v.say.length * 60); }
  if (vega) vega.label.hidden = vegaSpeaking;
  const vegaPlace = v && (places[v.location] ?? places[v.home]);
  if (vega && vegaPlace) { // off it trundles, wherever it's gone (straight there when the page first opens)
    const { at, facing } = vegaSpot(vegaPlace);
    vega.target.copy(at);
    vega.facing = facing;
    if (vega.fresh) { vega.root.position.copy(at); vega.root.rotation.y = facing; vega.fresh = false; }
  }
  drawTicker(v);
  if (v) {
    const dayAgo = v.history.find((point) => point.t >= Date.now() / 1000 - 86400)?.v ?? v.start;
    vegaMood = v.worth > dayAgo * 1.002 ? 1 : v.worth < dayAgo * 0.998 ? -1 : 0;
  }

  const research = s.learned.filter((m) => m.query).at(-1);
  researchHolo.hidden = !research || !researchAnchor;
  if (research) {
    const { headline, points, paragraph } = noteParts(research.text);
    const gist = headline || points[0] || paragraph;
    const summary = gist.length > 150 ? `${gist.slice(0, 147)}…` : gist;
    researchHolo.replaceChildren(el('b', '', `LAST SEARCH: ${research.query.toUpperCase()}`), el('span', '', summary));
  }

  asleep = s.asleep;
  charge = s.needs.charge;
  setForm(s.form);
  const avatar = $('avatar');
  avatar.dataset.shape = s.form?.shape ?? 'orb';
  document.querySelector('#panel header').style.setProperty('--form', s.form?.color ?? '#3ff0ff');
  avatar.classList.toggle('asleep', s.asleep);
  $('identity').textContent = `${s.form?.shape ?? 'orb'} · day ${dayOfLife(s)}`;
  $('about').textContent = s.form?.about ? `"${s.form.about}"` : '';
  if (places[s.location]) moveTo(places[s.location]);
}

// ---------------------------------------------------------------------------
// Reading Ember's state (written by run_local.py, or by GitHub Actions online)
// ---------------------------------------------------------------------------
let scenery = withDefaults();
buildScenery(scenery);
const sceneryReady = fetch(`scenery.json?t=${Date.now()}`, { cache: 'no-store' })
  .then((response) => (response.ok ? response.json() : null))
  .then((loaded) => { if (loaded) { scenery = withDefaults(loaded); buildScenery(scenery); } })
  .catch(() => {});

let latest = null;
async function refresh() {
  try {
    const response = await fetch(`data/state.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!response.ok) throw new Error('no state yet');
    const s = await response.json();
    if (!BUILDING) buildWorld(s); // in builder mode, the world shows your unsaved draft instead
    if (s.gallery_key !== galleryKey) { // something new was made: fetch the gallery
      const galleryResponse = await fetch(`data/gallery.json?t=${Date.now()}`, { cache: 'no-store' });
      galleryItems = galleryResponse.ok ? await galleryResponse.json() : [];
      galleryKey = s.gallery_key;
      paintArt(galleryItems.findLast((work) => work.type === 'drawing')?.svg);
    }
    latest = s;
    render(s);
  } catch {
    $('status').textContent = IS_LOCAL ? "Can't reach Ember. Is run_local.py still running?" : 'Waiting for the first thought…';
  }
}
async function pollForever() {
  await refresh();
  setTimeout(pollForever, POLL_MS);
}
pollForever();
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => { // catch up as soon as you open it again
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (Date.now() - hiddenAt > 120000) { seenBefore = lastSeen; feedKey = ''; } // away a while: show what's new since
  refresh();
});
setInterval(() => { if (latest) render(latest); }, 1000); // keeps the countdown ticking between polls

if (BUILDING) { // builder mode lives in its own file, so the public page stays light
  import('./builder.js').then(({ startBuilder }) => startBuilder({
    THREE, scene, camera, renderer, controls, buildWorld, buildScenery, withDefaults,
    loadScenery: () => sceneryReady.then(() => scenery),
    getWorldGroup: () => worldGroup, getPlaces: () => places, getState: () => latest,
    getSceneryGroup: () => sceneryGroup, getSceneryParts: () => sceneryParts,
    builtInLooks: Object.keys(builders),
  }));
}

document.querySelectorAll('.tabs button').forEach((button) => button.addEventListener('click', () => {
  tab = button.dataset.tab;
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b === button));
  feedKey = '';
  if (latest) renderFeed(latest);
}));

// The camera bar: follow Ember or Vega (or not), back to the whole roof, and real sky or night all the time
document.querySelectorAll('#cam [data-follow]').forEach((button) => button.addEventListener('click', () => {
  setFollow(button.dataset.follow);
  if (followed()) flyTo(followed().clone().setY(1));
}));
$('cam-reset').addEventListener('click', () => { setFollow('free'); flyTo(HOME_VIEW.target, HOME_VIEW.camera); });
function setSky(mode) {
  skyMode = mode;
  const button = $('cam-sky');
  button.textContent = mode === 'night' ? '🌙' : '☀';
  button.title = mode === 'night' ? 'Always night. Click for the real sky over London'
    : 'The sky follows the real sun over London. Click for night all the time';
  store.set('sky', mode);
  applyDaylight(latest?.weather?.code);
}
$('cam-sky').addEventListener('click', () => setSky(skyMode === 'night' ? 'live' : 'night'));
setFollow(store.get('follow', 'free'));
setSky(store.get('sky', 'live'));
</script>
</body>
</html>
