# Keeps Ember alive on GitHub, for free:
#  - every 10 minutes, runs one moment of Ember's life (tick_once.py). The 10-minute heartbeat comes from
#    cron-job.org calling "Run workflow" through GitHub's API, because GitHub's own schedule is unreliable;
#    the schedule below is just an hourly backup in case that ever stops.
#  - saves Ember's memories to the "data" branch (kept as a single commit, so history stays small)
#  - publishes the website to GitHub Pages
# Pushing code to main also republishes the site, without making Ember think.

name: Ember lives

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      awake:
        description: "Wake Ember up if it's asleep"
        type: boolean
        default: false
      dream:
        description: "Dream now: write today's diary and sort its memories early (tonight's dream redoes it)"
        type: boolean
        default: false
      reset:
        description: "Start Ember's life over from scratch (forgets EVERYTHING)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write  # save memories to the data branch
  issues: write    # file Ember's wishes as issues
  pages: write
  id-token: write

concurrency:
  group: ember
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Load Ember's memories from the data branch
        run: |
          mkdir -p site/data
          if git ls-remote --exit-code --heads origin data; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C site/data
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Live one moment
        if: github.event_name != 'push'
        run: python tick_once.py ${{ inputs.awake && '--wake' || '' }} ${{ inputs.dream && '--dream' || '' }} ${{ inputs.reset && '--reset' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Ember's memories to the data branch
        if: github.event_name != 'push'
        working-directory: site/data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b data
          git config user.name "ember-bot"
          git config user.email "ember-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Ember's memories"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Tidy up before publishing
        run: |
          rm -rf site/data/.git
          cp buildings.json site/buildings.json  # the page draws the layout from this, so builder changes show straight away

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
